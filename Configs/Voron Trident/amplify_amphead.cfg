#####
# EXTRUDER CONFIG
# This section is paramount. You need your heater to PWM outside the sample rate of the probe
#####
[extruder]
pwm_cycle_time: 0.0000303 # 30.3kHz duty cycle

#####
# Z DRIVE CONFIGS
# In order to get the best results here, have a good number of microsteps
####

[stepper_z]
microsteps: 128

[stepper_z1]
microsteps: 128

[stepper_z2]
microsteps: 128

# Swap tmc2209 for your stepper drivers!
[tmc2209 stepper_z]
interpolate: False

# Swap tmc2209 for your stepper drivers!
[tmc2209 stepper_z1]
interpolate: False

# Swap tmc2209 for your stepper drivers!
[tmc2209 stepper_z2]
interpolate: False

[mcu amplify]
serial: /dev/serial/by-id/usb-LDO_Amplify_stm32f042x6_20000F000D43304146393820-if00
restart_method: command

[temperature_sensor amplify]
sensor_type: temperature_mcu
sensor_mcu: amplify

[board_pins amplify]
mcu: amplify
aliases:
    SPI1_SCK=PA5,
    SPI1_SDI=PA7,
    SPI1_SDO=PA6,
    SPI1_CS=PA4,
    DRDY=PA2

[load_cell_probe]
counts_per_gram: 126 # Use the value that is written on your box!
sensor_type: ads1220
spi_speed: 512000
spi_bus: spi1
cs_pin: amplify:SPI1_CS
data_ready_pin: amplify:DRDY
input_mux: AIN1_AIN0
vref: REF0
sample_rate: 2000
gain: 128
x_offset: 0
y_offset: 0
z_offset: 0
trigger_force: 160
speed: 2
lift_speed: 20
retry_speed: 50
samples: 1
samples_result: median
sample_retract_dist: 0.23
samples_tolerance: 0.005
samples_tolerance_retries: 50 ; 5
bad_probe_strategy: circle
bad_probe_retries: 5
pullback_speed: 0.33
drift_filter_cutoff_frequency: 0.8
activate_gcode:
    {% set PROBE_TEMP = 170 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}

[nozzle_cleanup]
samples: 5
scrubbing_frequency: 2

[bed_mesh]
speed: 400
horizontal_move_z: 2
horizontal_z_clearance: 0.4 # new Kalico option for adaptive z height in bed meshes
mesh_min: 10,10

# mesh_max: 240,240 # Uncomment for 250mm build
# mesh_max: 290,290 # Uncomment for 300mm build
# mesh_max: 340,340 # Uncomment for 350mm build

# use 10 x 10 probes. You can afford this because only 1 sample will be taken
# This is the same time cost a 5x5 with 3 probes at each spot, but 2x the resolution.
probe_count: 10
adaptive_margin: 5
# Do NOT use zero_reference_position!! All of the z positions on the mesh are absolute.
# Use agressive move splitting to fight high / low spots
move_check_distance: 3.0
# high values _may_ cause streaks
# I paid for 1 micron accuracy (with my blood, sweat and tears), I want 1 micron adjustments
split_delta_z: 0.01
fade_start: 0.6
fade_end: 10.0
# more mesh PPS allows more exact bicubic curve expression
# 285 / 10 / 5 = 7.1mm mesh resolution
mesh_pps: 5
# bicubic this is the only option for high probe counts
algorithm: bicubic
bicubic_tension: 0.2  # default
